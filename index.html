<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <title>Recipe Roulette</title>
    </head>
    <body>
        <header>
            <div class="center-left"><h4>Recipe Roulette</h4></div>
            <div class="center">
                <select name="Filter" id="fil"> <!-- Select lässt den benutzer von bestimmte Optionen als Angabe auswählen -->
                    <option value="cat">Category</option> <!-- Option enhält die Werte die ausgewählz werden können -->
                    <option value="area">Area</option>
                </select>
            </div>
            <div class="center">
                <select name="filterValue" id="filVal">
                    <option value="None">Select Category</option>
                </select>
            </div>
            <div class="center"><button id="rand">Get Random Recipe</button></div>
        </header>
        <main>
            <div id="recipeHeader" class="preload">
                <img id="recipeImage" src="https://placehold.co/250" alt="">
                <div>
                    <h3 id="name" >Name of recipe</h3>
                    <p id="category">Category: </p>
                    <p id="area">Area: </p>
                    <p id="tags">Tags: </p>
                </div>
            </div>
            <div id="recipeMain" class="preload">
                <h2 class="secondaryColor">Ingredients</h2>
                <ul id="ingredientList">
                </ul>
                <h2 class="secondaryColor">Instructions</h2>
                <p id="Instructions"></p>
                <br>
                <p id="yt"></p>
                <br>
                <audio controls src="" id="instructionsToSpeech"></audio>
            </div>
        </main>
        <footer>
            <a href="./impressum">Impressum (Legal Notice)</a> ·
            <a href="./quellen">Quellen &amp; Rechte (Sources &amp; Rights)</a> ·
            <a href="./datenschutz">Datenschutz (Privacy)</a>
        </footer>
        <script src="index.js"></script>
        <script src="https://js.puter.com/v2/"></script>
    </body>
</html>
